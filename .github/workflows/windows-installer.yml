name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows app folder
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\build_windows.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\inno_build.ps1 -SkipBuild

      - name: Zip app folder
        shell: powershell
        run: Compress-Archive -Path dist\smtp_unlock -DestinationPath SMTP_Unlock_App_Folder.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SMTP_Unlock_Setup
          path: installer\SMTP_Unlock_Setup.exe

      - name: Upload app folder zip
        uses: actions/upload-artifact@v4
        with:
          name: SMTP_Unlock_App_Folder
          path: SMTP_Unlock_App_Folder.zip
